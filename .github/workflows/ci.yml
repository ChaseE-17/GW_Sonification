name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # weekly: online tests, GWOSC sweep, notebooks
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests scripts

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # LALSuite has no Windows wheels, so Windows tests the core (data) install only
      - name: Install (core + model extra)
        if: runner.os != 'Windows'
        run: pip install ".[test,model]"
      - name: Install (core)
        if: runner.os == 'Windows'
        run: pip install ".[test]"
      - name: Offline tests
        run: pytest
      - name: CLI smoke test
        run: gwsonify --help && gwsonify --version

  online:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install ".[test,model,video]"
      - name: Online tests
        run: pytest --online -m online
      - name: Notebooks
        run: pytest --notebooks -m notebook
      - name: GWOSC compatibility sweep
        run: python scripts/sweep.py --per-catalog 1 --out sweep/sweep-results.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-results
          path: sweep/
