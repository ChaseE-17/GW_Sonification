[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gwsonify"
dynamic = ["version"]
description = "Hear gravitational waves: turn GWOSC events and detector strain into audio, figures and video."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ChaseE-17" }]
keywords = ["gravitational waves", "sonification", "GWOSC", "LIGO", "Virgo", "KAGRA", "audio", "outreach"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "gwpy>=3.0.8",
    "gwosc>=0.7",
    "h5py>=3.8",
    "requests>=2.28",
]

[project.optional-dependencies]
model = ["pesummary>=1.3", "lalsuite>=7.15"]
video = ["imageio-ffmpeg>=0.4.9"]
skymap = ["ligo.skymap>=2.0"]
notebook = ["gwsonify[model,video]", "jupyterlab", "ipykernel", "ipywidgets"]
test = ["pytest>=7.4", "nbclient>=0.9", "ipykernel", "nbformat"]
dev = ["gwsonify[test,model,video]", "ruff>=0.6"]
all = ["gwsonify[model,video,skymap,notebook]"]

[dependency-groups]
dev = ["pytest>=7.4", "nbclient>=0.9", "ipykernel", "nbformat", "ruff>=0.6"]

[project.scripts]
gwsonify = "gwsonify.cli:main"

[project.urls]
Homepage = "https://github.com/ChaseE-17/GW_Sonification"
Issues = "https://github.com/ChaseE-17/GW_Sonification/issues"
Source = "https://github.com/ChaseE-17/GW_Sonification"

[tool.hatch.version]
path = "src/gwsonify/__init__.py"

[tool.hatch.build.targets.sdist]
# explicit allowlist: only project files go into the source distribution
only-include = ["src", "tests", "notebooks", "scripts", "docs/sweep-results.md",
                "README.md", "LICENSE", "CITATION.cff", "pyproject.toml"]
exclude = ["*.ipynb_checkpoints", "__pycache__", "gwsonify-output"]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error::gwsonify.GwsonifyWarning"]
markers = [
    "online: needs network access to GWOSC/Zenodo (run with --online)",
    "notebook: executes the teaching notebooks (run with --notebooks)",
    "model: needs the [model] extra (pesummary + lalsuite)",
]
log_level = "INFO"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "RUF", "SIM", "C4", "PTH", "PL", "NPY"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004", "PLC0415",
    "PLW0603", "RUF001", "RUF002", "RUF003", "SIM105", "E501",
    "RUF046",  # int(round(x)) is needed: round(np.float64) is a float on NumPy < 2
]

[tool.ruff.lint.per-file-ignores]
"src/gwsonify/__init__.py" = ["E402"]
"tests/**" = ["PLR", "B018"]
"notebooks/**" = ["E402", "B018", "PLR"]
